name: CI

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 正常编译：每次 push / PR 运行 lint 与编译检查，不构建镜像。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Compile
        run: uv run python -m py_compile main.py

  # 发布版本：仅当推送 v* tag（或手动 workflow_dispatch 仅构建不推送）时，
  # 经 test 门禁后构建并推送镜像，tag 由 docker/metadata-action 生成。
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [builtin, external]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io 要求镜像名全小写（github.repository 含大写 EaphoneTech）。
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # builtin / external 的 tag 规则互不相同，拆成两个 metadata 步骤按 variant 二选一执行，
      # 每个变体的 tags 全集一目了然，无需用 flavor.prefix + prefix= 覆盖去绕 auto-latest。
      - name: Extract metadata (builtin)
        id: meta-builtin
        if: matrix.variant == 'builtin'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false：latest 由下方 type=raw 显式生成，不依赖 auto-latest。
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,prefix=
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - name: Extract metadata (external)
        id: meta-external
        if: matrix.variant == 'external'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            prefix=external-
          tags: |
            # latest 由 raw 显式生成（prefix= 覆盖 flavor 的 external-），
            # 避免生成裸 latest 覆盖 builtin 的 latest。
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=external-latest,prefix=
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            VARIANT=${{ matrix.variant == 'external' && 'external' || 'builtin' }}
          tags: ${{ steps.meta-builtin.outputs.tags || steps.meta-external.outputs.tags }}
          labels: ${{ steps.meta-builtin.outputs.labels || steps.meta-external.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
