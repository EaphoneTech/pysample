[project]
name = "pysample"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "loguru>=0.7.3",
    "python-docx>=1.1.2",
]

[tool.ruff.lint]
ignore = ["F821", "E501"]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "NPY",  # numpy specific rules
    "PERF", # "perflint"
    "RUF",  # ruff specific rules
]
